<html>
  <body>
    {% if name %}
    <h1>Hello {{ name }}!</h1>
    {% else %}
    <h1>Hello world!</h1>
    {% endif %}
    <ul>
      {% for product in products %}
      <li>{{ product.full_name }}</li>
      {% endfor %}
    </ul>
    {% comment %}
    <ul>
      {% for order in orders %}
      <li>{{ order.id }} - {{ order.orderitem }}</li>
      {% endfor %}
    </ul>
    {% endcomment %} {{ result }}
  </body>
</html>
